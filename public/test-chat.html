<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nsamble test chat</title>
<style>
  :root { --bg: #0d1117; --surface: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff; --green: #3fb950; --orange: #d29922; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 16px; font-weight: 600; }
  #status { font-size: 12px; color: var(--muted); }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 10px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #1f6feb; color: #fff; }
  .msg.assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); }
  .msg.system { align-self: center; background: transparent; color: var(--muted); font-size: 12px; border: 1px dashed var(--border); padding: 6px 12px; }
  .msg.agent { align-self: flex-start; background: #1a2332; border: 1px solid #1f6feb44; }
  .msg .label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .msg .usage { font-size: 11px; color: var(--muted); margin-top: 6px; }
  #input-area { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
  #input-area input { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; outline: none; }
  #input-area input:focus { border-color: var(--accent); }
  button { padding: 10px 16px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; }
  #send-btn { background: var(--accent); color: #fff; }
  #send-btn:disabled { opacity: 0.4; cursor: default; }
  #agent-btn { background: var(--green); color: #000; }
  #agent-btn:disabled { opacity: 0.4; cursor: default; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--muted); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>nsamble test chat</h1>
  <span id="status">not connected</span>
</header>

<div id="messages"></div>

<div id="input-area">
  <input id="input" type="text" placeholder="Type a message..." disabled>
  <button id="send-btn" disabled>Send</button>
  <button id="agent-btn" disabled title="Run cost estimator subagent on your message">Cost Est.</button>
</div>

<script>
  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send-btn");
  const agentBtn = document.getElementById("agent-btn");
  const statusEl = document.getElementById("status");

  let ctx = null;

  function addMessage(role, text, extra) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    let html = "";
    if (role === "agent") html += '<div class="label">cost-estimator subagent</div>';
    html += escapeHtml(text);
    if (extra) html += '<div class="usage">' + escapeHtml(extra) + "</div>";
    div.innerHTML = html;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }

  function setLoading(on) {
    inputEl.disabled = on;
    sendBtn.disabled = on;
    agentBtn.disabled = on;
    if (on) {
      statusEl.innerHTML = '<span class="spinner"></span> working...';
    } else {
      statusEl.textContent = "session: " + (ctx ? ctx.sessionId.slice(0, 8) : "none");
    }
  }

  async function setup() {
    statusEl.textContent = "setting up...";
    try {
      const res = await fetch("/api/test/setup", { method: "POST" });
      if (!res.ok) throw new Error(await res.text());
      ctx = await res.json();
      addMessage("system", "Session started. You can chat or run the cost estimator subagent.");
      setLoading(false);
    } catch (e) {
      statusEl.textContent = "setup failed: " + e.message;
    }
  }

  async function sendChat() {
    const text = inputEl.value.trim();
    if (!text || !ctx) return;
    inputEl.value = "";
    addMessage("user", text);
    setLoading(true);

    try {
      const res = await fetch("/api/test/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...ctx, message: text }),
      });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      const cost = data.usage?.totalCost ? "$" + Number(data.usage.totalCost).toFixed(6) : "";
      const tokens = data.usage ? `in:${data.usage.inputTokens} out:${data.usage.outputTokens}` : "";
      addMessage("assistant", data.text, [tokens, cost].filter(Boolean).join(" | "));
    } catch (e) {
      addMessage("system", "Error: " + e.message);
    }
    setLoading(false);
  }

  async function runAgent() {
    const text = inputEl.value.trim();
    if (!text || !ctx) return;
    inputEl.value = "";
    addMessage("user", "[cost-estimator] " + text);
    setLoading(true);

    try {
      const res = await fetch("/api/test/subagent", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...ctx, role: "cost-estimator", input: text }),
      });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      addMessage("agent", data.output || "(no output)", "status: " + data.status + " | messages: " + data.messageCount);
    } catch (e) {
      addMessage("system", "Agent error: " + e.message);
    }
    setLoading(false);
  }

  sendBtn.addEventListener("click", sendChat);
  agentBtn.addEventListener("click", runAgent);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      if (e.ctrlKey) runAgent();
      else sendChat();
    }
  });

  setup();
</script>
</body>
</html>
